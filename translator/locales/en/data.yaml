    "Values %v are not allowed": Values %v are not allowed
    "Should be %v": Should be %v
    "Cannot be %v": Cannot be %v
    "Should contain unique values": Should contain unique values
  uuid:
    "Should be fulfilled": Should be fulfilled
    "Only %s values is allowed": Only %s values is allowed
  map:
    "Should be fulfilled": Should be fulfilled
    "Cannot contain more than %d elements":
      one: Cannot contain more than %d element
      other: Cannot contain more than %d elements
    "Cannot contain less than %d elements":
      one: Cannot contain less than %d element
      other: Cannot contain less than %d elements
  slice:
    "Should be fulfilled": Should be fulfilled
    "Cannot contain more than %d elements":
      one: Cannot contain more than %d element
      other: Cannot contain more than %d elements
