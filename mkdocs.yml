site_name: valigo
site_description: Typed, zero allocation validation of Go structs, rules are configured by pointers to the fields
site_url: https://insei.github.io/valigo/
repo_url: https://github.com/Insei/valigo
repo_name: Insei/valigo
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Insei/valigo
    - icon: simple/go
      link: https://pkg.go.dev/github.com/insei/valigo

nav:
  - Get started:
      - index.md
      - Why valigo?: why-valigo.md
      - Performance: performance.md
      - Upgrading from v0.0.x: upgrading.md
      - For AI agents: ai-agents.md
  - Configuration:
      - features/index.md
      - Validator and Configure: features/configure.md
      - Types and conversions: features/conversions.md
      - Absent values: features/absent.md
      - Conditions: features/conditions.md
      - Custom rules: features/custom.md
      - Rules on other fields: features/fields.md
      - Rules from tags: features/tags.md
  - Rules:
      - Strings: features/strings.md
      - Numbers: features/numbers.md
      - Time: features/time.md
      - Comparable values: features/values.md
      - UUID: features/uuid.md
      - Slices: features/slices.md
      - Maps: features/maps.md
  - Errors:
      - Errors: features/errors.md
      - Translations: features/translations.md
      - HTTP problem details: features/problem.md
  - Integrations:
      - JSON Schema: features/schema.md
      - huma: features/huma.md
      - gin: features/gin.md
      - echo: features/echo.md
      - go-i18n: features/goi18n.md
  - Architecture:
      - How it works: architecture/index.md

plugins:
  - search
  # llms.txt and llms-full.txt for AI agents: https://llmstxt.org
  - llmstxt:
      full_output: llms-full.txt
      # the links point to the pages of the deployed version, it is set by the docs workflow
      base_url: !ENV [LLMSTXT_BASE_URL, "https://insei.github.io/valigo/latest/"]
      markdown_description: >-
        valigo validates Go structs by rules configured once with pointers to the fields of a model:
        b.Field(&u.Name).As(str.Of).Required().MaxLen(64). The configurator has Field, Slice, Map, When and Custom,
        As converts a field to the configurator of its type by a conversion with a type constraint (str.Of, num.Of,
        num.Ptr, timex.Of, eq.Of, str.Slice...), so the compiler checks the field types and the rule arguments
        (Go 1.27 generic methods). Validation of valid objects doesn't allocate, absent values are skipped by all
        rules except Required, errors have field locations, translated messages (en, de, es, fr, ru), stable codes
        and named params; the problem package writes RFC 9457 problem details, the github.com/insei/valigo/integrations/huma
        module validates huma inputs. The module path is github.com/insei/valigo.
      sections:
        Start:
          - index.md: installation and the first validator
          - why-valigo.md: what it gives compared to tag based validators
          - performance.md: benchmarks with go-playground/validator, ozzo-validation, zog, gookit/validate and hand-written code
          - upgrading.md: upgrading from v0.0.x
          - ai-agents.md: the skill for AI agents
        Configuration:
          - features/index.md: the map of the features
          - features/configure.md: the validator, Configure, the model, field pointers
          - features/conversions.md: Field, Slice, Map and As, the built-in conversions, conversions of your types
          - features/absent.md: nil pointers and nil nested structs
          - features/conditions.md: When on the struct and on fields, conditional requiredness
          - features/custom.md: Custom rules, rules from data
          - features/fields.md: rules on other fields
          - features/tags.md: the rules of the tags of go-playground/validator, a migration from it
        Rules:
          - features/strings.md: the rules and formats of strings
          - features/numbers.md: the rules of numbers
          - features/time.md: the rules of time.Time
          - features/values.md: the rules of comparable values, enums, bools
          - features/uuid.md: the rules of uuids, the separate module
          - features/slices.md: the rules of slices and their elements
          - features/maps.md: the rules of maps, their keys and values
        Errors:
          - features/errors.md: Validate, shared.Error, locations, codes for clients
          - features/translations.md: locales, plural forms, languages from the context
          - features/problem.md: problem details of RFC 9457
        Integrations:
          - features/schema.md: the rules as the keywords of JSON Schema, Validator.Constraints
          - features/huma.md: huma inputs, the rules in the OpenAPI document
          - features/gin.md: gin binding
          - features/echo.md: echo validator
          - features/goi18n.md: the translations of go-i18n bundles
        Architecture:
          - architecture/*.md
