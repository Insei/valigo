version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/uuid"
      - "/examples/*"
    schedule:
      interval: weekly
    # build(deps): bump ..., Conventional Commits are checked on pull requests
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
