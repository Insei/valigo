version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/rules/uuid"
      - "/huma"
      - "/gin"
      - "/echo"
      - "/bench"
      - "/examples/*"
    schedule:
      interval: weekly
    # build(deps): bump ..., Conventional Commits are checked on pull requests
    commit-message:
      prefix: build
      include: scope
    # the uuid and examples modules use the core by replace, so a dependency is bumped in all modules at once
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
