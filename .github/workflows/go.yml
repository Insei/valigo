name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  lint:
    runs-on: ubuntu-latest
    name: golangci-lint
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    # built from source by Go 1.27, so it parses the generic methods
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

    - name: Lint the core module
      run: golangci-lint run ./...

    - name: Lint the modules
      run: |
        . scripts/modules.sh
        for module in $MODULES; do
          (cd "$module" && golangci-lint run --config ../.golangci.yml ./...)
        done

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache-dependency-path: |
          go.sum
          */go.sum

    - name: Build
      run: |
        go build -v ./...
        . scripts/modules.sh
        for module in $MODULES; do
          (cd "$module" && go build -v ./...)
        done

    - name: Test the core module
      run: go test -v -race -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Test the modules
      id: modules
      run: |
        . scripts/modules.sh
        files=./coverage.txt
        for module in $MODULES; do
          (cd "$module" && go test -v -race -coverprofile="../coverage-$module.txt" -covermode=atomic ./...)
          files="$files,./coverage-$module.txt"
        done
        echo "coverage=$files" >> "$GITHUB_OUTPUT"

    - name: Check 100% coverage of every package
      run: scripts/check-coverage.sh

    - uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.modules.outputs.coverage }}

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache-dependency-path: |
          go.sum
          uuid/go.sum
          huma/go.sum
          examples/*/go.sum

    - name: Build and run the programs of the documentation and the skill
      run: scripts/check-examples.sh

    - name: Test the bench module
      working-directory: bench
      run: |
        go vet ./...
        go test -bench . -benchtime 100x ./...

    - name: Test the examples modules
      run: |
        for dir in examples/*/; do
          (cd "$dir" && go vet ./... && go test ./...)
        done

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - run: pip install -r docs/requirements.txt

    - name: Build the documentation
      run: mkdocs build --strict --site-dir site
